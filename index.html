<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner QR con Historial</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 min-h-screen">

    <div class="container mx-auto p-4 max-w-4xl">
        <header class="bg-indigo-600 text-white p-6 rounded-2xl shadow-lg mb-6 text-center">
            <h1 class="text-2xl font-bold flex justify-center items-center gap-2">
                📷 Escáner de Códigos QR
            </h1>
            <p class="text-sm opacity-90 mt-1">Reconoce códigos con tu cámara y guarda el historial localmente</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-2xl shadow-md flex flex-col justify-between">
                <div>
                    <h2 class="text-lg font-bold text-gray-700 mb-4 flex items-center gap-2">
                        📱 Lector en Vivo
                    </h2>
                    
                    <div class="border-2 border-dashed border-indigo-200 rounded-xl p-3 bg-gray-50 flex flex-col items-center justify-center min-h-[280px]">
                        <div id="reader" class="w-full rounded-lg overflow-hidden"></div>
                        <div id="placeholder-camara" class="text-center text-gray-400 p-4">
                            <p class="text-4xl mb-2">📷</p>
                            <p class="text-xs">Presiona el botón de abajo para otorgar permisos e iniciar la cámara de tu móvil.</p>
                        </div>
                    </div>
                </div>

                <div class="mt-4">
                    <button onclick="iniciarEscaneo()" id="btnIniciar" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-semibold shadow transition-all duration-200">
                        Activar Cámara Móvil
                    </button>
                    <button onclick="detenerEscaneo()" id="btnDetener" class="w-full bg-red-500 hover:bg-red-600 text-white py-3 rounded-xl font-semibold shadow transition-all duration-200 hidden">
                        Detener Cámara
                    </button>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-md flex flex-col h-[500px]">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-gray-700">📋 Datos Registrados</h2>
                    <button onclick="limpiarHistorial()" class="text-xs text-red-500 hover:text-red-700 font-semibold transition">
                        Borrar Todo
                    </button>
                </div>

                <div id="listaRegistros" class="flex-1 overflow-y-auto space-y-3 pr-1 text-sm">
                    </div>
            </div>
        </div>
    </div>

    <script>
        // Inicializar almacenamiento local para guardar los QR detectados
        let historialQR = JSON.parse(localStorage.getItem('historialQR')) || [];
        let scannerInstancia = null;

        window.onload = function() {
            renderHistorial();
        };

        // --- FUNCIÓN PARA ACTIVAR LA CÁMARA ---
        function iniciarEscaneo() {
            // Ocultar el marcador de posición y cambiar los botones
            document.getElementById('placeholder-camara').classList.add('hidden');
            document.getElementById('btnIniciar').classList.add('hidden');
            document.getElementById('btnDetener').classList.remove('hidden');

            // Configurar la instancia del escáner
            scannerInstancia = new Html5QrcodeScanner("reader", { 
                fps: 15, // Velocidad de escaneo por segundo
                qrbox: { width: 230, height: 230 }, // Caja guía en pantalla
                rememberLastUsedCamera: true, // Recuerda qué cámara usó (ej. trasera)
                supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA]
            });

            // Arrancar el escáner
            scannerInstancia.render(onScanSuccess, onScanFailure);
        }

        // --- DETENER LA CÁMARA ---
        function detenerEscaneo() {
            if (scannerInstancia) {
                scannerInstancia.clear().then(() => {
                    document.getElementById('placeholder-camara').classList.remove('hidden');
                    document.getElementById('btnIniciar').classList.remove('hidden');
                    document.getElementById('btnDetener').classList.add('hidden');
                }).catch(err => console.error("Error al cerrar cámara:", err));
            }
        }

        // --- CUANDO ENCUENTRA UN CÓDIGO QR ---
        function onScanSuccess(decodedText) {
            // Obtener fecha y hora actual
            const ahora = new Date();
            const fechaFormateada = ahora.toLocaleDateString('es-PE', { day: '2-digit', month: '2-digit', year: 'numeric' });
            const horaFormateada = ahora.toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            // Crear el objeto del nuevo registro
            const nuevoRegistro = {
                texto: decodedText,
                fecha: fechaFormateada,
                hora: horaFormateada
            };

            // Validar si el último código escaneado es exactamente igual (evita duplicar en un mismo segundo)
            if (historialQR.length > 0 && historialQR[0].texto === decodedText && historialQR[0].hora === horaFormateada) {
                return; // Ignora lecturas repetidas instantáneas
            }

            // Guardar en el arreglo (al inicio para que aparezca arriba)
            historialQR.unshift(nuevoRegistro);
            localStorage.setItem('historialQR', JSON.stringify(historialQR));

            // Alerta visual de éxito rápida
            Swal.fire({
                title: '¡QR Detectado!',
                text: decodedText.length > 50 ? decodedText.substring(0, 50) + '...' : decodedText,
                icon: 'success',
                timer: 1500,
                showConfirmButton: false
            });

            // Actualizar la lista en pantalla
            renderHistorial();
        }

        // Captura errores continuos mientras busca el QR (puedes dejarlo vacío para no saturar la consola)
        function onScanFailure(error) {
            // Flujo continuo de escaneo, no se necesita alertar cada milisegundo si no encuentra nada
        }

        // --- RENDERIZAR EL HISTORIAL EN LA WEB ---
        function renderHistorial() {
            const contenedor = document.getElementById('listaRegistros');
            contenedor.innerHTML = '';

            if (historialQR.length === 0) {
                contenedor.innerHTML = `
                    <div class="text-center text-gray-400 italic pt-12">
                        <p class="text-3xl mb-1">📋</p>
                        <p>No hay códigos escaneados aún.</p>
                    </div>`;
                return;
            }

            historialQR.forEach((qr, index) => {
                // Verificar si el texto detectado parece un enlace web válido
                const esLink = qr.texto.startsWith('http://') || qr.texto.startsWith('https://');

                contenedor.innerHTML += `
                    <div class="bg-indigo-50 border border-indigo-100 p-3 rounded-xl shadow-sm hover:bg-indigo-100 transition duration-150">
                        <div class="flex justify-between items-center mb-1 text-[11px] text-indigo-600 font-semibold">
                            <span>📅 ${qr.fecha}</span>
                            <span>⏰ ${qr.hora}</span>
                        </div>
                        <div class="text-gray-800 font-mono break-words text-xs">
                            ${esLink ? `<a href="${qr.texto}" target="_blank" class="text-blue-600 underline hover:text-blue-800">${qr.texto}</a>` : qr.texto}
                        </div>
                    </div>
                `;
            });
        }

        // --- LIMPIAR EL HISTORIAL ---
        function limpiarHistorial() {
            if (historialQR.length === 0) return;

            Swal.fire({
                title: '¿Limpiar historial?',
                text: "Se borrarán todos los códigos registrados.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'Sí, borrar todo',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    historialQR = [];
                    localStorage.removeItem('historialQR');
                    renderHistorial();
                    Swal.fire('Eliminado', 'El historial quedó vacío.', 'success');
                }
            });
        }
    </script>
</body>
</html>
